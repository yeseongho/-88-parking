services:
  - type: web
    name: olpark88-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OLPARK_PERFORMANCE_API_KEY
        sync: false
      - key: KMA_API_KEY
        sync: false
